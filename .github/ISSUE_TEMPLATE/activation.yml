name: Activation or installation issue
description: The plugin did not load or did not inject its policy.
body:
  - type: markdown
    attributes:
      value: Share only synthetic or redacted examples. Never include tokens, private code, or raw personal transcripts.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, Claude Code version, model, plugin version, other styles, and installation route.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste the output of /skip-echo:doctor, or of node <plugin dir>/scripts/doctor.mjs --debug-log <file> after claude --debug-file <file> --init-only. See docs/troubleshooting.md. Do not paste the raw debug log.
      render: text
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic conversation or reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
